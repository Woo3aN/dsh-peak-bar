<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Peak / off-peak billing capsule">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C323A"/>
      <stop offset="1" stop-color="#1C2127"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#tile)"/>
  <!-- the caption-strip capsule -->
  <rect x="4.25" y="11" width="23.5" height="10" rx="5" fill="#20262C" stroke="#E3E8EE" stroke-width="1.5"/>
  <!-- the billing window, in three steps -->
  <rect x="8" y="14.4" width="4.4" height="3.2" rx="1.1" fill="#AEB9C6"/>
  <rect x="13.4" y="14.4" width="3.2" height="3.2" rx="1.1" fill="#78838F"/>
  <rect x="17.6" y="14.4" width="3.2" height="3.2" rx="1.1" fill="#78838F"/>
  <!-- the balance, as the lit end of the bar -->
  <circle cx="24.2" cy="16" r="1.9" fill="#8FB3E0"/>
</svg>
